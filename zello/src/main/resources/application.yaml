spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: zello
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zello?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:zello}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
zello:
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5173}
    github:
      enabled: ${GITHUB_LOGIN_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/github}
      app-type: ${GITHUB_APP_TYPE:APP}
