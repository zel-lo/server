server {
    listen 80;
    listen [::]:80;
    server_name zello.asia www.zello.asia;
    client_max_body_size 2m;
    access_log /var/log/nginx/zello.access.log;
    error_log /var/log/nginx/zello.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zello;
        default_type text/plain;
        try_files $uri =404;
    }

    error_page 502 504 =503 /__zello_unavailable.html;
    location = /__zello_unavailable.html {
        internal;
        alias /var/www/zello/unavailable.html;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
